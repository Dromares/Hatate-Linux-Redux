# Type checking as a BLOCKING gate. The CI step fails the build on any
# finding.
#
# This used to be advisory - ~74 findings across 24 files, and a blocking
# gate on day one would have meant either fixing all of them in one commit
# or suppressing them wholesale, and the second is how a type checker
# becomes decoration. The intended path was the same ratchet the lint config
# describes: fix a file or a category, then tighten. DAN-18 (cycle 4) took
# the count to zero, so the gate is now real and the continue-on-error flag
# is gone from .github/workflows/tests.yml.
#
# Keeping it at zero is the ratchet itself: every commit must come in clean.
# Do not add suppressions to make a red build pass - fix the code or file a
# follow-up.
#
# Worth knowing before reading the output: a large share of the findings
# that used to be here were library stub artefacts rather than bugs in this
# code - BeautifulSoup's accessors are typed as `str | AttributeValueList` so
# every use of one read as a type error, and Pillow's constants
# (`Image.LANCZOS`) were missing from its stubs entirely. Those are the ones
# that went to zero in cycle 4, so if a stub artefact reappears that is the
# first thing to check.

[mypy]
# python_version is deliberately NOT pinned to 3.10, though that is the
# floor this project supports. Pinning it makes mypy parse the installed
# numpy's stubs under 3.10 rules, and those stubs use `type X = ...`
# statements from 3.12 - a hard parse error that aborts the run before any
# of this code is checked. The floor is enforced where it actually bites
# anyway: ruff.toml sets target-version py310, and CI runs the suite on
# 3.10 as well as current.

# Third-party packages here ship partial stubs or none. Without this the
# output is dominated by "cannot find implementation or library stub",
# which says nothing about this codebase.
ignore_missing_imports = True

# Bodies of unannotated functions stay unchecked, which is mypy's default
# and the right starting point for a codebase that is mostly unannotated:
# it means adding annotations to a function turns checking ON for it,
# so the coverage grows with the annotations instead of arriving all at
# once as a wall of errors.
check_untyped_defs = False

# Findings are easier to act on with the rule name attached, since the
# ratchet above is done a category at a time.
show_error_codes = True
pretty = True

[mypy-tests.*]
# The suite constructs deliberately malformed inputs, monkeypatches module
# attributes, and hands fakes to functions expecting real types - all of
# which is the point of the test and all of which reads as a type error.
ignore_errors = True
