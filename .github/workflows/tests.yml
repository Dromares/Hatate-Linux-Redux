name: tests

# The suite is fast (about 15 seconds) and needs no network: every
# HTTP call in it is stubbed. There is no reason not to run it on
# everything.
#
# DAN-1256: `push` is limited to main. With a bare `push:` every push to a
# PR branch ran the whole matrix twice on the same SHA - once as a push and
# once as a pull_request. The pull_request run covers the branch (and is the
# only one stale-base runs on); the push run on main is the post-merge check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # DAN-213: branch-protection's "require branches to be up to date
  # before merging" is unavailable on this plan (private repo, free
  # tier - gh api .../branches/main/protection returns 403). This job is
  # the replacement enforcement point: it fails the PR the moment
  # origin/main has moved past the PR's own base, so a merge can't land
  # a branch that only tested against a now-stale main. Runs only on
  # pull_request - a push to main is main itself, so staleness relative
  # to main is meaningless there.
  stale-base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # merge-base needs real history, not the 1-commit shallow
          # clone checkout defaults to.
          fetch-depth: 0

      - name: Check PR head is up to date with main
        run: scripts/check_merge_base.sh

  # Separate from the test matrix on purpose: linting doesn't care which
  # Python runs it and doesn't need Qt's system libraries, so running it
  # once is both faster and clearer to read when it's the thing that
  # failed.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        # The runtime dependencies come too: without them mypy resolves
        # PyQt6, bs4 and Pillow to nothing and reports missing-import
        # noise instead of anything about this code.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        # Blocking. The ruleset is deliberately narrow - see ruff.toml for
        # what is enabled, what isn't, and why.
        run: ruff check .

      - name: Mypy
        # Blocking. mypy reached zero findings in cycle 4 (DAN-18), so this
        # is a real gate now: any new finding fails the build. The count
        # stays at zero by the same ratchet the lint config uses - see
        # mypy.ini.
        #
        # DAN-472: this used to read `mypy core gui workers`, which left
        # tools/, ops/, and main.py checked by nothing - an un-gated path
        # that had carried 2 live errors since DAN-55 without CI ever
        # seeing them. `tests/` stays excluded (see `[mypy-tests.*]` in
        # mypy.ini); everything else this repo ships goes through mypy.
        run: mypy core gui workers tools ops main.py

  test:
    runs-on: ubuntu-latest
    # DAN-1256: the default is 360 minutes, so one hung leg (DAN-1238) held a
    # runner for six hours. A healthy leg takes a few minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the code's syntax supports, and current.
        # Nothing between them is likely to differ, and a wide matrix on
        # every push costs more than it finds.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Qt's runtime libraries
        # PyQt6's wheel bundles Qt itself but not the system libraries it
        # links against. Without these the offscreen platform plugin fails
        # to load and every GUI test errors on import, which reads as the
        # tests being broken rather than the runner being incomplete.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        env:
          # No display on a runner; the GUI tests are written to work
          # against Qt's offscreen platform.
          QT_QPA_PLATFORM: offscreen
        run: coverage run -m unittest discover -s tests -t . -v

      - name: Coverage
        run: |
          # xml BEFORE report, deliberately. .coveragerc sets fail_under,
          # so `report` exits non-zero the moment coverage drops below the
          # floor - and if it ran first it would take the xml step with
          # it, leaving no artifact to upload on precisely the run where
          # someone needs to see which lines went uncovered.
          coverage xml
          coverage report

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
